apiVersion: apps/v1
kind: Deployment
metadata: {name: coredns-edge, namespace: aiops}
spec:
  replicas: 2
  selector: {matchLabels: {app: coredns-edge}}
  template:
    metadata: {labels: {app: coredns-edge}}
    spec:
      containers:
      - name: coredns
        image: coredns/coredns:1.12.4
        args: ["-conf","/etc/coredns/Corefile"]
        ports:
        - {containerPort: 53, protocol: UDP}
        - {containerPort: 53, protocol: TCP}
        volumeMounts:
        - {name: config, mountPath: /etc/coredns}
      volumes:
      - name: config
        configMap: {name: coredns-custom}
