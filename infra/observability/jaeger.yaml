apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: aiops-observability
spec:
  replicas: 1
  selector: {matchLabels: {app: jaeger}}
  template:
    metadata: {labels: {app: jaeger}}
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/jaeger:2.21.0
        args: ["--config","/etc/jaeger/jaeger.yaml"]
        ports:
        - {containerPort: 16686}
        - {containerPort: 4317}
        - {containerPort: 4318}
        - {containerPort: 13133}
        readinessProbe: {httpGet: {path: /status, port: 13133}, initialDelaySeconds: 10, periodSeconds: 10}
        volumeMounts:
        - {name: config, mountPath: /etc/jaeger}
      volumes:
      - name: config
        configMap: {name: jaeger-config}
---
apiVersion: v1
kind: Service
metadata: {name: jaeger, namespace: aiops-observability}
spec:
  selector: {app: jaeger}
  ports:
  - {name: ui, port: 16686, targetPort: 16686}
  - {name: otlp-grpc, port: 4317, targetPort: 4317}
  - {name: otlp-http, port: 4318, targetPort: 4318}
