apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: auth-service-ingress
  namespace: aiops

spec:
  rules:
    - host: auth.local

      http:
        paths:
          - path: /

            pathType: Prefix

            backend:
              service:
                name: auth-service

                port:
                  number: 8000
