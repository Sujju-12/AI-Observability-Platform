apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-engine
  namespace: aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-engine-read
  namespace: aiops
rules:
- apiGroups: [""]
  resources: ["pods","pods/log","events","services","configmaps"]
  verbs: ["get","list","watch"]
- apiGroups: ["apps"]
  resources: ["deployments","replicasets","statefulsets"]
  verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-engine-read
  namespace: aiops
subjects:
- kind: ServiceAccount
  name: ai-engine
  namespace: aiops
roleRef:
  kind: Role
  name: ai-engine-read
  apiGroup: rbac.authorization.k8s.io
