apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engine
  namespace: aiops
spec:
  replicas: 2
  selector: {matchLabels: {app: ai-engine}}
  template:
    metadata: {labels: {app: ai-engine}}
    spec:
      serviceAccountName: ai-engine
      containers:
      - name: ai-engine
        image: ai-engine:v1.0.0
        imagePullPolicy: Never
        ports: [{containerPort: 8080}]
        env:
        - {name: TARGET_NAMESPACE, value: aiops}
        - {name: PROMETHEUS_URL, value: "http://prometheus-server.aiops-observability.svc.cluster.local:9090"}
        - {name: OLLAMA_URL, value: "http://host.docker.internal:11434"}
        - {name: OLLAMA_MODEL, value: "qwen2.5:3b"}
        readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: ai-engine, namespace: aiops}
spec:
  selector: {app: ai-engine}
  ports: [{port: 8080, targetPort: 8080}]
