apiVersion: apps/v1
kind: Deployment
metadata: {name: aiops-crash-test, namespace: aiops}
spec:
  replicas: 1
  selector: {matchLabels: {app: aiops-crash-test}}
  template:
    metadata: {labels: {app: aiops-crash-test}}
    spec:
      containers:
      - name: crash
        image: busybox:1.36
        command: ["sh","-c","echo AI incident test: startup failed; exit 1"]
